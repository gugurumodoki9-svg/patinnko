<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<style id="webmakerstyle">
body { background: #050505; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }

/* ログイン */
.login-btn-fancy { background: white; color: #757575; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 4px; display: flex; align-items: center; gap: 12px; cursor: pointer; }

/* スロットエリア修正 */
#slot-container {
    background: #000; border: 4px solid #444; border-radius: 12px;
    margin-bottom: 10px; padding: 10px; text-align: center;
}
#slot-display { font-size: 40px; display: flex; justify-content: center; gap: 15px; height: 60px; align-items: center; }
#combo-display { font-size: 12px; color: #f0f; margin-top: 5px; font-weight: bold; }

/* 筐体 */
#pachinko-machine { background: #151515; border: 6px solid #333; border-radius: 20px; padding: 15px; width: 320px; flex-shrink: 0; }
canvas { background: #000; display: block; margin: 0 auto; border: 2px solid #222; border-radius: 5px; }

/* 換金ボタン（太く調整） */
#prize-exchange-area { display: flex; gap: 6px; margin-top: 10px; }
.ex-btn { flex: 1; height: 50px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; box-shadow: 0 4px 0 #000; }
.ex-btn:active { transform: translateY(2px); box-shadow: none; }
.bronze { background: #cd7f32; } .silver { background: #aaa; color:#000; } .gold { background: #ffd700; color:#000; }

/* サイドパネル 2カラム */
#side-panel { flex: 1; background: #1a1a1a; padding: 15px; border-radius: 12px; border: 2px solid #333; max-width: 900px; align-self: flex-start; }
.side-flex { display: flex; gap: 15px; height: 100%; }
.side-left { flex: 1; display: flex; flex-direction: column; gap: 15px; min-height: 100%; }
.side-right { flex: 1.6; display: flex; flex-direction: column; gap: 15px; min-height: 100%; }

.shop-scroll { overflow-y: auto; max-height: 400px; padding-right: 5px; }
.panel-title { font-size: 14px; margin: 0 0 10px 0; border-bottom: 2px solid #333; padding-bottom: 5px; }

/* リスト系 */
.list-container { background: #000; padding: 8px; border-radius: 8px; font-size: 11px; overflow-y: auto; }
.ranking-box { height: 100px; }
.mission-box { height: 260px; }
#prize-exchange-area { display: flex; gap: 6px; margin-top: 0; }
.mission-item { padding: 5px 4px; border-bottom: 1px solid #222; color: #888; display: flex; flex-direction: column; gap: 1px; }
.mission-item.done { color: #0f0; }
.mission-item.claimable { color: #ff0; background: rgba(0,255,0,0.05); border-left: 2px solid #0f0; }

/* 汎用ボタン・入力 */
.styled-button { border-radius: 6px; cursor: pointer; font-weight: bold; border: none; padding: 12px; }
.buy-btn { width: 100%; background: #333; color: #fff; margin-bottom: 10px; }
#shootBtn { width: 100%; background: linear-gradient(#00ced1, #008b8b); padding: 15px; font-size: 18px; color: #fff; border-bottom: 4px solid #005f5f; }
.machine-footer { display: flex; gap: 5px; margin-top: 10px; }
#gift-btn { flex: 1; background: #9400d3; color: #fff; }
.admin-open-btn { flex: 1; background: #ffd700; color: #000; }
.reset-btn { background: #400; color: #f66; font-size: 10px; padding: 8px; }

/* ニュースティッカー */
#news-bar { background: #000; border: 2px solid #0ff; border-radius: 8px; display: none; align-items: center; overflow: hidden; box-shadow: 0 0 10px rgba(0,255,255,0.2); margin-top: 12px; }
#news-label { background: #0ff; color: #000; font-weight: bold; font-size: 11px; padding: 8px 12px; white-space: nowrap; flex-shrink: 0; letter-spacing: 2px; }
#news-dot { width: 8px; height: 8px; background: red; border-radius: 50%; margin: 0 10px; flex-shrink: 0; animation: blink-dot 1s infinite; }
#news-ticker-wrap { flex: 1; overflow: hidden; padding: 8px 0; }
#news-ticker-text { white-space: nowrap; font-size: 12px; color: #0ff; display: inline-block; animation: ticker-scroll 30s linear infinite; text-shadow: 0 0 6px #0ff; }
@keyframes ticker-scroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
@keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:0.2} }


/* 管理者パネル拡張 */
.admin-content { width: 320px !important; max-height: 85vh; overflow-y: auto; }
.adm-section { border: 1px solid #444; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.adm-section-title { font-size: 10px; color: #0ff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333; text-align: center; }
.adm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.adm-grid label { font-size: 9px; color: #aaa; display: flex; flex-direction: column; gap: 2px; }
.adm-grid input { background: #111; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 3px; font-size: 11px; }

.shop-item { background: #252525; padding: 10px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; border: 1px solid #333; display: flex; justify-content: space-between; font-size: 11px; }
.shop-item.equipped { border-color: #0ff; background: #102525; }

/* モーダル */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
.modal-content { background: #222; padding: 20px; border-radius: 12px; border: 2px solid #0f0; width: 280px; text-align: center; }
.styled-input { background: #000; color: #fff; border: 1px solid #444; padding: 8px; width: 90%; margin-bottom: 10px; }
</style>

<script>const firebaseConfig = {
    apiKey: "AIzaSyA10j1O95LaPI_QrfqdalapIomXmzXRCms",
    authDomain: "patinnko2.firebaseapp.com",
    databaseURL: "https://patinnko2-default-rtdb.firebaseio.com",
    projectId: "patinnko2",
    storageBucket: "patinnko2.firebasestorage.app",
    messagingSenderId: "1084492073320",
    appId: "1:1084492073320:web:f6430e8a6fa1300c8c6edd"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// グローバル設定デフォルト
window.G_KAKUHEN_PROB = 0.45;
window.G_NORMAL_PROB  = 0.08;
window.G_GOLD_PROB    = 0.30;
window.G_SILVER_RATE  = 500;
window.G_GOLD_RATE    = 2000;
window.G_LUCK_MULTI   = 1;
window.newsMessages   = [];

// ニュース監視（全プレイヤーにリアルタイム反映）
db.ref('system/news').on('value', snap => {
    const data = snap.val();
    window.newsMessages = (data && data.messages) ? data.messages : [];
    setTimeout(() => { if(typeof window.startNewsTicker === 'function') window.startNewsTicker(); }, 100);
});

// 設定監視（配当・ラックマルチ）
db.ref('system/settings').on('value', snap => {
    const d = snap.val();
    if(!d) return;
    if(d.kakuhen_prob !== undefined) window.G_KAKUHEN_PROB = d.kakuhen_prob;
    if(d.normal_prob  !== undefined) window.G_NORMAL_PROB  = d.normal_prob;
    if(d.gold_prob    !== undefined) window.G_GOLD_PROB    = d.gold_prob;
    if(d.silver_rate  !== undefined) window.G_SILVER_RATE  = d.silver_rate;
    if(d.gold_rate    !== undefined) window.G_GOLD_RATE    = d.gold_rate;
    if(d.luck_multi   !== undefined) {
        window.G_LUCK_MULTI = d.luck_multi;
        const el = document.getElementById('luck-multi-display');
        if(el) el.innerText = `LUCK x${d.luck_multi}`;
    }
});

// グローバル変数（Firebaseリスナーからアクセスできるよう外に出す）
let money, balls, inventory, ownedItems, equippedTool, activeSkin;
let stock, isSpinning, isKakuhen, currentUser = null;
let totalSpent, comboCount, totalShots;
let debt;
let loanBalls;

window.onload = function() {
    init(); // 最初にlocalStorageからデータ読み込み

    const ITEM_LIST = {
        tools: [
            {id:'t-auto', name:'🔫 自動連射機', price:5000},
            {id:'t-magnet', name:'🧲 磁力チャッカー', price:50000},
            {id:'t-twin', name:'⚔️ ツイン発射', price:500000},
            {id:'t-triple', name:'🔱 トリプル射出', price:2000000},
            {id:'t-gravity', name:'🌌 重力崩壊', price:10000000}
        ],
        skins: [
            {id:'s-def', name:'📱 標準', price:0, bg:'#000', pin:'#ddd'},
            {id:'s-neon', name:'🌈 ネオン', price:100000, bg:'#001', pin:'#0ff'},
            {id:'s-gold', name:'✨ 純金', price:1000000, bg:'#210', pin:'#ff0'},
            {id:'s-ruby', name:'🍎 紅蓮', price:5000000, bg:'#300', pin:'#f00'},
            {id:'s-dia', name:'💎 剛金', price:20000000, bg:'#112', pin:'#fff'},
            {id:'s-galaxy', name:'🌌 銀河', price:100000000, bg:'#001', pin:'#f0f'},
            {id:'s-void', name:'⬛ 無', price:500000000, bg:'#000', pin:'#222'}
        ]
    };

    function init(isReset = false) {
        if (isReset) {
            money = 1000; balls = 100;
            inventory = { bronze: 0, silver: 0, gold: 0 };
            ownedItems = ['s-def']; activeSkin = 's-def'; equippedTool = null;
            totalSpent = 0; comboCount = 0; totalShots = 0; debt = 0; loanBalls = 0;
            localStorage.clear();
        } else {
            money = parseInt(localStorage.getItem('p_money')) || 1000;
            balls = parseInt(localStorage.getItem('p_balls')) || 100;
            inventory = JSON.parse(localStorage.getItem('p_prizes') || '{"bronze":0,"silver":0,"gold":0}');
            ownedItems = JSON.parse(localStorage.getItem('p_owned') || '["s-def"]');
            activeSkin = localStorage.getItem('p_skin') || 's-def';
            equippedTool = localStorage.getItem('p_tool') || null;
            totalSpent = parseInt(localStorage.getItem('p_spent')) || 0;
            comboCount = parseInt(localStorage.getItem('p_combo')) || 0;
            totalShots = parseInt(localStorage.getItem('p_shots')) || 0;
            debt       = parseInt(localStorage.getItem('p_debt'))  || 0;
            loanBalls  = parseInt(localStorage.getItem('p_loan_balls')) || 0;
        }
        stock = 0; isSpinning = false; isKakuhen = false;
    }
;

    const canvas = document.getElementById('pachinkoCanvas');
    const ctx = canvas.getContext('2d');
    let activeBalls = [], pegs = [];
    const outHoles = [{x: 10, y: 230, w: 60, h: 10}, {x: 230, y: 230, w: 60, h: 10}];

    function createPegs() {
        pegs = [];
        for (let y = 60; y <= 210; y += 30) {
            let off = (Math.floor(y/30)%2===0) ? 15 : 0;
            for (let x = 30; x < 280; x += 30) pegs.push({x: x+off, y: y, type:'pin'});
        }
        const addRail = (x1, y1, x2, y2) => {
            let dist = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
            for(let i=0; i<dist; i+=4) pegs.push({x: x1+(x2-x1)*(i/dist), y: y1+(y2-y1)*(i/dist), type:'rail'});
        };
        addRail(0, 260, 110, 315); addRail(300, 260, 190, 315);
    }
    createPegs();

    function onLoginSuccess(user) {
        currentUser = user;
        window._updateUI = updateUI;
        window.showToast = showToast; // ギフト通知用にグローバル登録
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('pachinko-container').style.display = 'flex';
        document.getElementById('news-bar').style.display = 'flex';

        // ログイン時利息計算（10%/回）
        if(debt > 0) {
            const interest = Math.floor(debt * 0.10);
            debt += interest;
            localStorage.setItem('p_debt', debt);
        localStorage.setItem('p_loan_balls', loanBalls);
            setTimeout(() => {
                showToast(`💀 利息 +$${interest.toLocaleString()} 加算！ 借金総額: $${debt.toLocaleString()}`, '#f44', 3000);
                updateUI();
            }, 1000);
        }

        updateUI(); listenGifts(); draw();
        setTimeout(() => updateRanking(), 500); // UIがdbに書いてからランキング取得
        window.startNewsTicker();
    }

    // タブ閉じても自動ログイン維持
    auth.onAuthStateChanged(user => {
        if(user) { onLoginSuccess(user); }
    });

    document.getElementById('google-login-btn').onclick = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then(res => onLoginSuccess(res.user));
    };

    function updateRanking() {
        db.ref('users').orderByChild('money').limitToLast(5).on('value', snap => {
            const list = document.getElementById('ranking-list');
            list.innerHTML = "";
            let arr = []; snap.forEach(s => arr.push(s.val()));
            arr.reverse().slice(0, 5).forEach((u, i) => {
                list.innerHTML += `<div class="rank-item"><span>${i+1}. ${u.name}</span><span>$${u.money.toLocaleString()}</span></div>`;
            });
        });
    }

    window.exchangeSingle = (type) => {
        const rate = type === 'gold' ? window.G_GOLD_RATE : (type === 'silver' ? window.G_SILVER_RATE : 100);
        if (inventory[type] > 0) {
            let gain = inventory[type] * rate;
            money += gain; inventory[type] = 0; updateUI();
        }
    };

    window.authAdmin = () => {
        if(document.getElementById('admin-pw').value.includes("ryo1031")) {
            document.getElementById('admin-panel-ui').style.display = 'block';
            // 現在の設定値をフォームに反映
            document.getElementById('adm-kakuhen-prob').value = (window.G_KAKUHEN_PROB * 100).toFixed(0);
            document.getElementById('adm-normal-prob').value  = (window.G_NORMAL_PROB  * 100).toFixed(0);
            document.getElementById('adm-gold-prob').value    = (window.G_GOLD_PROB    * 100).toFixed(0);
            document.getElementById('adm-silver-rate').value  = window.G_SILVER_RATE;
            document.getElementById('adm-gold-rate').value    = window.G_GOLD_RATE;
            document.getElementById('adm-luck-multi').value   = window.G_LUCK_MULTI;
        }
    };
    window.applyAdminSelf = () => {
        const m = parseInt(document.getElementById('adm-money').value);
        const b = parseInt(document.getElementById('adm-balls').value);
        if(!isNaN(m)) money = m;
        if(!isNaN(b)) balls = b;
        updateUI();
        alert("書き換えたぜ");
    };
    window.distributeGift = () => {
        const m = parseInt(document.getElementById('adm-dist-money').value);
        const b = parseInt(document.getElementById('adm-dist-balls').value);
        if(isNaN(m) && isNaN(b)) return alert("金額か玉数を入れてくれ");
        const gMoney = isNaN(m) ? 0 : m;
        const gBalls = isNaN(b) ? 0 : b;
        db.ref('users').once('value', snap => {
            snap.forEach(u => db.ref('gifts/' + u.key).push({money: gMoney, balls: gBalls}));
            alert(`配布完了！ $${gMoney.toLocaleString()} + ${gBalls}玉`);
        });
    };
    window.postNews = () => {
        const msg = document.getElementById('adm-news-input').value.trim();
        if(!msg) return alert("ニュース内容を入れてくれ");
        const existing = window.newsMessages || [];
        const updated = [{text: msg, timestamp: Date.now()}, ...existing].slice(0, 5);
        db.ref('system/news').set({messages: updated});
        document.getElementById('adm-news-input').value = '';
        alert("ニュース投稿完了！");
    };
    window.clearNews = () => {
        db.ref('system/news').set({messages: []});
        alert("ニュースをクリアしたぜ");
    };
    window.applyPayouts = () => {
        const settings = {
            kakuhen_prob: parseFloat(document.getElementById('adm-kakuhen-prob').value) / 100,
            normal_prob:  parseFloat(document.getElementById('adm-normal-prob').value)  / 100,
            gold_prob:    parseFloat(document.getElementById('adm-gold-prob').value)    / 100,
            silver_rate:  parseInt(document.getElementById('adm-silver-rate').value),
            gold_rate:    parseInt(document.getElementById('adm-gold-rate').value),
            luck_multi:   window.G_LUCK_MULTI
        };
        if(Object.values(settings).some(v => isNaN(v))) return alert("正しい値を入れてくれ");
        db.ref('system/settings').set(settings);
        alert("配当を全員に反映したぜ！");
    };
    window.applyLuckMulti = () => {
        const lm = parseFloat(document.getElementById('adm-luck-multi').value);
        if(isNaN(lm) || lm < 0) return alert("正しい値を入れてくれ");
        db.ref('system/settings').update({luck_multi: lm});
        alert(`ラックマルチ x${lm} を全員に反映したぜ！`);
    };

    // ニュースティッカー
    window.startNewsTicker = () => {
        const msgs = window.newsMessages;
        const el = document.getElementById('news-ticker-text');
        if(!el) return;
        if(!msgs || msgs.length === 0) {
            el.style.animation = 'none'; el.offsetHeight;
            el.innerText = 'SYSTEM ONLINE --- 超インフレ・パチンコへようこそ ---';
            el.style.animation = 'ticker-scroll 30s linear infinite';
            return;
        }
        const combined = msgs.map(m => `◆ ${m.text}`).join('　　　　　');
        el.innerText = combined + '　　　　　';
        el.style.animation = 'none'; el.offsetHeight;
        const duration = Math.max(20, combined.length * 0.28);
        el.style.animation = `ticker-scroll ${duration}s linear infinite`;
    };

    function listenGifts() {
        let firstLoad = true;
        db.ref('gifts/' + currentUser.uid).on('value', snap => {
            const list = document.getElementById('gift-list');
            list.innerHTML = "";
            let count = 0;
            snap.forEach(g => {
                const d = g.val();
                if(!d || (!d.money && !d.balls)) return;
                count++;
                const btn = document.createElement('button');
                btn.className = "buy-btn";
                btn.innerText = `🎁 $${(d.money||0).toLocaleString()} + ${d.balls||0}玉 受け取る`;
                btn.onclick = () => {
                    money += (d.money || 0);
                    balls += (d.balls || 0);
                    db.ref('gifts/' + currentUser.uid + '/' + g.key).remove();
                    showToast(`🎁 $${(d.money||0).toLocaleString()} + ${d.balls||0}玉 受け取った！`, '#9400d3', 2500);
                    updateUI();
                };
                list.appendChild(btn);
            });
            if(count === 0) {
                list.innerHTML = '<div style="color:#555;font-size:12px;padding:8px;">ギフトなし</div>';
            } else if(!firstLoad) {
                // 新着ギフト通知
                showToast(`🎁 新しいギフトが ${count}件 届いた！`, '#9400d3', 3000);
            }
            firstLoad = false;
        });
    }

    function updateUI() {
        document.getElementById('money').innerText = money.toLocaleString();
        document.getElementById('balls').innerText = balls;
        const luckEl = document.getElementById('luck-multi-display');
        if(luckEl) luckEl.innerText = `LUCK x${window.G_LUCK_MULTI || 1}`;
        const debtEl = document.getElementById('debt-display');
        if(debtEl) { debtEl.innerText = debt > 0 ? `💀 借金 $${debt.toLocaleString()}` : ''; debtEl.style.display = debt > 0 ? 'block' : 'none'; }
        const debtPanel = document.getElementById('debt-panel-amount');
        if(debtPanel) {
            debtPanel.innerText = `$${(debt||0).toLocaleString()}`;
            debtPanel.style.color = debt > 0 ? '#f44' : '#555';
            document.getElementById('debt-panel').style.borderColor = debt > 0 ? '#f44' : '#333';
            document.getElementById('debt-panel').style.background = debt > 0 ? '#1a0000' : '#111';
        }
        document.getElementById('p-bronze').innerText = inventory.bronze;
        document.getElementById('p-silver').innerText = inventory.silver;
        document.getElementById('p-gold').innerText = inventory.gold;
        document.getElementById('combo-count').innerText = comboCount;
        document.getElementById('stock-lamps').innerText = "●".repeat(stock) + "○".repeat(4-stock);
        
        document.getElementById('kakuhen-lamp').innerText = isKakuhen ? "🔥 確変中 🔥" : "通常";
        document.getElementById('pachinko-machine').className = isKakuhen ? 'kakuhen-mode' : '';

        // ミッション（id, name, condition, reward_money, reward_balls）
        const mList = document.getElementById('mission-list');
        const claimedMissions = JSON.parse(localStorage.getItem('p_m_claimed') || '[]');
        const ms = [
            {id:'m01', n:"初打ち: 100発",           c:totalShots>=100,       rm:500,    rb:20},
            {id:'m02', n:"修行中: 1,000発",          c:totalShots>=1000,      rm:2000,   rb:100},
            {id:'m03', n:"廃人: 10,000発",           c:totalShots>=10000,     rm:10000,  rb:500},
            {id:'m04', n:"伝説: 100,000発",          c:totalShots>=100000,    rm:100000, rb:2000},
            {id:'m05', n:"小金持ち: $10万",           c:money>=100000,         rm:5000,   rb:50},
            {id:'m06', n:"富豪: $100万",             c:money>=1000000,        rm:50000,  rb:200},
            {id:'m07', n:"億万長者: $1億",            c:money>=100000000,      rm:500000, rb:1000},
            {id:'m08', n:"神: $10億",               c:money>=1000000000,     rm:5000000,rb:5000},
            {id:'m09', n:"連チャン: 3連",             c:comboCount>=3,         rm:1000,   rb:30},
            {id:'m10', n:"連チャン: 5連",             c:comboCount>=5,         rm:3000,   rb:80},
            {id:'m11', n:"神業: 15連",              c:comboCount>=15,        rm:30000,  rb:300},
            {id:'m12', n:"超神業: 30連",             c:comboCount>=30,        rm:200000, rb:1000},
            {id:'m13', n:"浪費家: $1万消費",          c:totalSpent>=10000,     rm:2000,   rb:50},
            {id:'m14', n:"大浪費: $100万消費",        c:totalSpent>=1000000,   rm:20000,  rb:200},
            {id:'m15', n:"破産寸前: $1億消費",        c:totalSpent>=100000000, rm:500000, rb:2000},
            {id:'m16', n:"自動連射機を購入",           c:ownedItems.includes('t-auto'),    rm:3000,  rb:100},
            {id:'m17', n:"磁力チャッカー購入",          c:ownedItems.includes('t-magnet'),  rm:10000, rb:200},
            {id:'m18', n:"重力崩壊を購入",            c:ownedItems.includes('t-gravity'), rm:100000,rb:500},
            {id:'m19', n:"コレクター: スキン3種所持",   c:ownedItems.filter(i=>i.startsWith('s-')).length>=3, rm:20000, rb:300},
            {id:'m20', n:"究極コレクター: 全スキン所持", c:ownedItems.filter(i=>i.startsWith('s-')).length>=7, rm:1000000, rb:2000},
        ];
        mList.innerHTML = ms.map(m => {
            const claimed = claimedMissions.includes(m.id);
            const canClaim = m.c && !claimed;
            const statusIcon = claimed ? '✅' : (m.c ? '🎁' : '❌');
            const rewardText = `$${m.rm.toLocaleString()} + ${m.rb}玉`;
            return `<div class="mission-item ${claimed?'done':(m.c?'claimable':'')}">
                <span>${statusIcon} ${m.n}</span>
                <span style="font-size:9px; color:#888;">${rewardText}</span>
                ${canClaim ? `<button class="styled-button" style="font-size:9px;padding:3px 8px;background:#0f0;color:#000;margin-top:3px;width:100%;" onclick="claimMission('${m.id}',${m.rm},${m.rb})">受け取る</button>` : ''}
            </div>`;
        }).join('');

        const render = (target, list, type) => {
            document.getElementById(target).innerHTML = list.map(i => {
                const isE = (type === 't' && equippedTool === i.id) || (type === 's' && activeSkin === i.id);
                return `<div class="shop-item ${isE?'equipped':''}" onclick="itemAction('${i.id}',${i.price},'${type}')">
                    <span>${i.name}</span><span>${ownedItems.includes(i.id) ? (isE?'装備中':'所有') : '$'+i.price.toLocaleString()}</span>
                </div>`;
            }).join('');
        };
        render('shop-tools', ITEM_LIST.tools, 't');
        render('shop-skins', ITEM_LIST.skins, 's');
        renderLoans();

        localStorage.setItem('p_money', money);
        localStorage.setItem('p_balls', balls);
        localStorage.setItem('p_prizes', JSON.stringify(inventory));
        localStorage.setItem('p_spent', totalSpent);
        localStorage.setItem('p_shots', totalShots);
        localStorage.setItem('p_debt', debt);
        localStorage.setItem('p_loan_balls', loanBalls);
        localStorage.setItem('p_owned', JSON.stringify(ownedItems));
        localStorage.setItem('p_skin', activeSkin);
        localStorage.setItem('p_tool', equippedTool || "");
        if (currentUser) db.ref('users/' + currentUser.uid).set({name: currentUser.displayName, money: money});
    }

    window.buyBalls = () => { if (money >= 150) { money -= 150; totalSpent += 150; balls += 50; updateUI(); } };

    window.claimMission = (id, rm, rb) => {
        const claimed = JSON.parse(localStorage.getItem('p_m_claimed') || '[]');
        if(claimed.includes(id)) return;
        claimed.push(id);
        localStorage.setItem('p_m_claimed', JSON.stringify(claimed));
        money += rm; balls += rb;
        showToast(`🎁 $${rm.toLocaleString()} + ${rb}玉 GET!`, '#0f0', 2000);
        updateUI();
    };

    // 融資プラン（借りると毎ログイン10%利息）
    const LOAN_LIST = [
        {id:'l-sm',  name:'⚡ 小口融資', amount:10000,   desc:'$10,000借入 / 利息10%/ログイン'},
        {id:'l-md',  name:'💵 中口融資', amount:100000,  desc:'$100,000借入 / 利息10%/ログイン'},
        {id:'l-lg',  name:'💰 大口融資', amount:1000000, desc:'$1,000,000借入 / 利息10%/ログイン'},
        {id:'l-vip', name:'👑 VIP融資',  amount:10000000,desc:'$10,000,000借入 / 利息10%/ログイン'},
    ];

    function renderLoans() {
        const el = document.getElementById('shop-loans');
        if(!el) return;
        el.innerHTML = LOAN_LIST.map(l => `
            <div class="shop-item" onclick="takeLoan('${l.id}')">
                <div>
                    <div>${l.name}</div>
                    <div style="font-size:9px;color:#888;">${l.desc}</div>
                </div>
                <span style="color:#f90;font-size:10px;">借りる</span>
            </div>`).join('');
    }

    window.repayDebt = (all = false) => {
        if(debt <= 0) return;
        const amt = all ? debt : parseInt(document.getElementById('custom-loan-input').value);
        if(!all && (isNaN(amt) || amt <= 0)) return alert("返済額を入れてくれ");
        if(money < amt) return alert("所持金が足りない！");
        const actual = Math.min(amt, debt);
        money -= actual; debt -= actual;
        showToast(`✅ $${actual.toLocaleString()} 返済完了！残債: $${debt.toLocaleString()}`, '#0f0', 2500);
        updateUI();
    };

    window.takeCustomLoan = () => {
        const amt = parseInt(document.getElementById('custom-loan-input').value);
        if(isNaN(amt) || amt <= 0) return alert("金額を入力してくれ");
        if(!confirm(`$${amt.toLocaleString()} 借りますか？
利息: ログインのたびに10%加算`)) return;
        money += amt; debt += amt;
        document.getElementById('custom-loan-input').value = '';
        showToast(`💸 $${amt.toLocaleString()} 借入完了！`, '#f90', 2000);
        updateUI();
    };

    window.takeLoan = (id) => {
        const l = LOAN_LIST.find(x => x.id === id);
        if(!l) return;
        if(!confirm(`${l.name}\n借入額: $${l.amount.toLocaleString()}\n利息: ログインのたびに10%加算\n\n借りますか？`)) return;
        money += l.amount; debt += l.amount;
        showToast(`💸 $${l.amount.toLocaleString()} 借入完了！`, '#f90', 2000);
        updateUI();
    };

    function showToast(msg, color, dur=2000) {
        const t = document.createElement('div');
        t.innerText = msg;
        t.style.cssText = `position:fixed;top:15%;left:50%;transform:translateX(-50%);background:#111;border:2px solid ${color};color:${color};padding:10px 20px;border-radius:10px;font-weight:bold;z-index:9999;font-size:13px;pointer-events:none;white-space:nowrap;`;
        document.body.appendChild(t);
        setTimeout(()=>t.remove(), dur);

    };

    function draw() {
        const skin = ITEM_LIST.skins.find(s => s.id === activeSkin) || ITEM_LIST.skins[0];
        ctx.fillStyle = skin.bg; ctx.fillRect(0, 0, 300, 340);
        outHoles.forEach(h => { ctx.fillStyle = "#300"; ctx.fillRect(h.x, h.y, h.w, h.h); });
        pegs.forEach(p => {
            ctx.fillStyle = (p.type==='rail') ? "#444" : skin.pin;
            ctx.beginPath(); ctx.arc(p.x, p.y, (p.type==='rail'?1.2:2), 0, 7); ctx.fill();
        });

        let cX = 135 + Math.sin(Date.now()/500) * 60;
        ctx.strokeStyle = "#0ff"; ctx.strokeRect(cX, 315, 30, 15);

        for (let i = 0; i < activeBalls.length; i++) {
            let b = activeBalls[i]; b.vy += 0.22; b.x += b.vx; b.y += b.vy;
            pegs.forEach(p => {
                let dx = b.x - p.x, dy = b.y - p.y, d = Math.sqrt(dx*dx+dy*dy);
                if (d < 7) { let a = Math.atan2(dy, dx); b.vx = Math.cos(a) * 1.8; b.vy = Math.sin(a) * 1.8; }
            });
            outHoles.forEach(h => { if(b.x > h.x && b.x < h.x+h.w && b.y > h.y && b.y < h.y+h.h) { activeBalls.splice(i,1); i--; } });
            if (b && b.y > 315 && b.x > cX && b.x < cX + 30) {
                activeBalls.splice(i, 1); i--;
                if (stock < 4) { stock++; updateUI(); startSlot(); }
            } else if (b && b.y > 350) { activeBalls.splice(i, 1); i--; }
            if (b) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill(); }
        }
        requestAnimationFrame(draw);
    }

    function startSlot() {
        if (isSpinning) return;
        isSpinning = true;
        let count = 0;
        const timer = setInterval(() => {
            const syms = ["🎰", "💰", "💎", "🍒", "7️⃣"];
            ['s1', 's2', 's3'].forEach(id => document.getElementById(id).innerText = syms[Math.floor(Math.random()*5)]);
            if (++count > 12) { clearInterval(timer); checkWin(); }
        }, 80);
    }

    function checkWin() {
        const prob      = isKakuhen ? window.G_KAKUHEN_PROB : window.G_NORMAL_PROB;
        const goldProb  = window.G_GOLD_PROB;
        const LM        = window.G_LUCK_MULTI || 1;

        if (Math.random() < prob) {
            if (Math.random() < goldProb) {
                // ラックボーナス: LM=2→10%...LM=10→80%, LM=11以上→確定+追加
                let gain = window.G_GOLD_RATE;
                gain = applyLuckBonusP(gain, LM);
                inventory.gold++; isKakuhen = true; comboCount++;
            } else {
                let gain = window.G_SILVER_RATE;
                gain = applyLuckBonusP(gain, LM);
                inventory.silver++; isKakuhen = false; comboCount = 0;
            }
        } else if (document.getElementById('s1').innerText === document.getElementById('s2').innerText) {
            inventory.bronze++;
        }
        isSpinning = false; stock--; updateUI();
        if (stock > 0) setTimeout(startSlot, 300);
    }

    // ラックマルチ: 勝利時の換金額にボーナス（確率式）
    function applyLuckBonusP(base, LM) {
        if(LM === 1) return base;
        const toast = (msg) => {
            const t = document.createElement('div');
            t.innerText = msg; t.style.cssText = 'position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#000;border:2px solid #a0f;color:#a0f;padding:8px 16px;border-radius:8px;font-weight:bold;z-index:9999;font-size:14px;';
            document.body.appendChild(t); setTimeout(()=>t.remove(), 2000);
        };
        if(LM > 1) {
            if(LM <= 10) {
                const chance = (LM - 1) * 0.1;
                if(Math.random() < chance) { toast(`⭐ LUCK BONUS x${LM}!`); return Math.floor(base * LM); }
            } else {
                let result = Math.floor(base * LM);
                const extraChance = (LM - 10) * 0.1;
                if(Math.random() < extraChance) { toast(`🌟 DOUBLE LUCK!! x${LM}x${LM}!`); result = Math.floor(result * LM); }
                else { toast(`⭐ LUCK BONUS x${LM}!`); }
                return result;
            }
        } else if(LM < 1) {
            const chance = 1 - LM;
            if(Math.random() < chance) { toast(`💀 BAD LUCK x${LM}`); return Math.floor(base * LM); }
        }
        return base;
    }

    document.getElementById('shootBtn').onclick = () => {
        if (balls <= 0) return;
        let count = (equippedTool === 't-twin') ? 2 : (equippedTool === 't-triple' ? 3 : (equippedTool === 't-gravity' ? 5 : 1));
        for(let i=0; i<count; i++) {
            if (balls > 0) { balls--; totalShots++; activeBalls.push({x: 150+(Math.random()-0.5)*20, y: -10, vx: (Math.random()-0.5)*2, vy: 2}); }
        }
        updateUI();
    };

    setInterval(() => { if(equippedTool === 't-auto' && balls > 0) document.getElementById('shootBtn').click(); }, 400);

    window.itemAction = (id, price, type) => {
        if (!ownedItems.includes(id)) { if (money >= price) { money -= price; ownedItems.push(id); } }
        else { if (type === 't') equippedTool = (equippedTool === id) ? null : id; if (type === 's') activeSkin = id; }
        updateUI();
    };

    window.softReset = () => { if(confirm("全リセットするぜ？")) { init(true); updateUI(); } };
    window.openAdmin = () => document.getElementById('admin-modal').style.display='flex';
    window.openGiftBox = () => document.getElementById('gift-modal').style.display='flex';
    window.closeModal = (id) => document.getElementById(id).style.display='none';
};

</script>
