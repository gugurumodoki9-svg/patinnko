    {id:'m20', n:'究極コレクター: 全スキン所持', c:()=>ownedItems.filter(i=>i.startsWith('s-')).length>=7, rm:1000000, rb:2000},
];

// ===== Firebase リアルタイムリスナー =====
// 設定（配当・ラックマルチ）
db.ref('system/settings').on('value', snap => {
    const d = snap.val() || {};
    if (d.kakuhen_prob !== undefined) G.kakuhenProb = d.kakuhen_prob;
    if (d.normal_prob  !== undefined) G.normalProb  = d.normal_prob;
    if (d.gold_prob    !== undefined) G.goldProb    = d.gold_prob;
    if (d.silver_rate  !== undefined) G.silverRate  = d.silver_rate;
    if (d.gold_rate    !== undefined) G.goldRate    = d.gold_rate;
    if (d.luck_multi   !== undefined) G.luckMulti   = d.luck_multi;
    if (currentUser) updateUI();
});

// ニュース
db.ref('system/news').on('value', snap => {
    const data = snap.val();
    const msgs = (data && data.messages) ? data.messages : [];
    updateTicker(msgs);
});

// ===== 初期化 =====
function initData(reset = false) {
    if (reset) {
        money = 1000; balls = 100; debt = 0;
        inventory = {bronze:0, silver:0, gold:0};
        ownedItems = ['s-def']; activeSkin = 's-def'; equippedTool = null;
        totalSpent = 0; comboCount = 0; totalShots = 0;
        localStorage.clear();
    } else {
        money      = parseInt(localStorage.getItem('p_money'))  || 1000;
        balls      = parseInt(localStorage.getItem('p_balls'))  || 100;
        debt       = parseInt(localStorage.getItem('p_debt'))   || 0;
        inventory  = JSON.parse(localStorage.getItem('p_prizes') || '{"bronze":0,"silver":0,"gold":0}');
        ownedItems = JSON.parse(localStorage.getItem('p_owned')  || '["s-def"]');
        activeSkin   = localStorage.getItem('p_skin') || 's-def';
        equippedTool = localStorage.getItem('p_tool') || null;
        totalSpent   = parseInt(localStorage.getItem('p_spent')) || 0;
        comboCount   = parseInt(localStorage.getItem('p_combo')) || 0;
        totalShots   = parseInt(localStorage.getItem('p_shots')) || 0;
    }
    stock = 0; isSpinning = false; isKakuhen = false;
}

// ===== ログイン =====
auth.onAuthStateChanged(user => {
    if (user) onLogin(user);
});
document.getElementById('google-login-btn').onclick = () => {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(r => onLogin(r.user));
};

function onLogin(user) {
    currentUser = user;
    initData();

    // 利息計算
    if (debt > 0) {
        const interest = Math.floor(debt * 0.10);
        debt += interest;
        setTimeout(() => toast(`💀 利息 +$${interest.toLocaleString()} 加算！ 残債: $${debt.toLocaleString()}`, '#f44', 3000), 1000);
    }

    document.getElementById('login-screen').style.display   = 'none';
    document.getElementById('pachinko-container').style.display = 'flex';
    document.getElementById('news-bar').style.display       = 'flex';

    updateUI();
    setupCanvas();
    draw();
    setTimeout(updateRanking, 600);
    listenGifts();
}

// ===== セーブ =====
function saveData() {
    localStorage.setItem('p_money',  money);
    localStorage.setItem('p_balls',  balls);
    localStorage.setItem('p_debt',   debt);
    localStorage.setItem('p_prizes', JSON.stringify(inventory));
    localStorage.setItem('p_owned',  JSON.stringify(ownedItems));
    localStorage.setItem('p_skin',   activeSkin);
    localStorage.setItem('p_tool',   equippedTool || '');
    localStorage.setItem('p_spent',  totalSpent);
    localStorage.setItem('p_combo',  comboCount);
    localStorage.setItem('p_shots',  totalShots);
    if (currentUser) db.ref('users/' + currentUser.uid).set({name: currentUser.displayName, money});
}

// ===== UI更新 =====
function updateUI() {
    document.getElementById('money-display').innerText = money.toLocaleString();
    document.getElementById('balls-display').innerText = balls;
    document.getElementById('combo-count').innerText   = comboCount;
    document.getElementById('stock-lamps').innerText   = '●'.repeat(stock) + '○'.repeat(4 - stock);
    document.getElementById('luck-multi-display').innerText = `LUCK x${G.luckMulti}`;
    document.getElementById('kakuhen-lamp').innerText  = isKakuhen ? '🔥 確変中 🔥' : '通常';
    document.getElementById('pachinko-machine').className = isKakuhen ? 'kakuhen-mode' : '';
    document.getElementById('p-bronze').innerText = inventory.bronze;
    document.getElementById('p-silver').innerText = inventory.silver;
    document.getElementById('p-gold').innerText   = inventory.gold;

    // 借金パネル
    const panel = document.getElementById('debt-panel');
    document.getElementById('debt-panel-amount').innerText = '$' + (debt || 0).toLocaleString();
    panel.className = debt > 0 ? 'in-debt' : '';

    // ショップ
    renderShop('shop-tools', ITEMS.tools, 't');
    renderShop('shop-skins', ITEMS.skins, 's');
    renderLoans();

    // ミッション
    renderMissions();

    saveData();
}

function renderShop(targetId, list, type) {
    document.getElementById(targetId).innerHTML = list.map(item => {
        const owned    = ownedItems.includes(item.id);
        const equipped = (type === 't' && equippedTool === item.id) || (type === 's' && activeSkin === item.id);
        return `<div class="shop-item ${equipped ? 'equipped' : ''}" onclick="itemAction('${item.id}',${item.price},'${type}')">
            <span>${item.name}</span>
            <span>${owned ? (equipped ? '装備中' : '所有') : '$' + item.price.toLocaleString()}</span>
        </div>`;
    }).join('');
}

function renderLoans() {
    document.getElementById('shop-loans').innerHTML = ITEMS.loans.map(l =>
        `<div class="shop-item" onclick="takeLoan('${l.id}')">
            <div><div>${l.name}</div><div class="shop-item-desc">${l.desc}</div></div>
            <span style="color:#f90;">借りる</span>
        </div>`
    ).join('');
}

function renderMissions() {
    const claimed = JSON.parse(localStorage.getItem('p_m_claimed') || '[]');
    document.getElementById('mission-list').innerHTML = MISSIONS.map(m => {
        const done     = claimed.includes(m.id);
        const achieved = m.c();
        const claimable = achieved && !done;
        const cls = done ? 'done' : (claimable ? 'claimable' : '');
        const icon = done ? '✅' : (claimable ? '🎁' : '❌');
        return `<div class="mission-item ${cls}">
            <span>${icon} ${m.n}</span>
            <span class="mission-reward">$${m.rm.toLocaleString()} + ${m.rb}玉</span>
            ${claimable ? `<button class="claim-btn" onclick="claimMission('${m.id}',${m.rm},${m.rb})">受け取る</button>` : ''}
        </div>`;
    }).join('');
}

// ===== ランキング =====
function updateRanking() {
    db.ref('users').orderByChild('money').limitToLast(5).on('value', snap => {
        const arr = [];
        snap.forEach(s => arr.push(s.val()));
        arr.reverse();
        document.getElementById('ranking-list').innerHTML = arr.map((u, i) =>
            `<div class="rank-item"><span>${i+1}. ${u.name}</span><span>$${u.money.toLocaleString()}</span></div>`
        ).join('') || '<div style="color:#555;padding:4px;">データなし</div>';
    });
}

// ===== ギフト =====
function listenGifts() {
    db.ref('gifts/' + currentUser.uid).on('value', snap => {
        const list = document.getElementById('gift-list');
        list.innerHTML = '';
        let count = 0;
        snap.forEach(g => {
            const d = g.val();
            if (!d) return;
            count++;
            const btn = document.createElement('button');
            btn.className = 'styled-button buy-btn';
            btn.style.marginBottom = '8px';
            btn.innerText = `🎁 $${(d.money||0).toLocaleString()} + ${d.balls||0}玉`;
            btn.onclick = () => {
                money += (d.money || 0);
                balls += (d.balls || 0);
                db.ref('gifts/' + currentUser.uid + '/' + g.key).remove();
                toast(`🎁 受け取った！ +$${(d.money||0).toLocaleString()} +${d.balls||0}玉`, '#9400d3', 2500);
                updateUI();
            };
            list.appendChild(btn);
        });
        if (count === 0) list.innerHTML = '<div style="color:#555;font-size:12px;padding:8px;">ギフトなし</div>';
        else if (count > 0) toast(`🎁 ギフトが${count}件届いてるぞ！`, '#9400d3', 2500);
    });
}

// ===== ニュースティッカー =====
function updateTicker(msgs) {
    const el = document.getElementById('news-ticker-text');
    if (!el) return;
    const text = msgs.length > 0
        ? msgs.map(m => `◆ ${m.text}`).join('　　　　　') + '　　　　　'
        : 'SYSTEM ONLINE --- 超インフレ・パチンコへようこそ ---';
    el.innerText = text;
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    const dur = Math.max(20, text.length * 0.28);
    el.style.animation = `ticker-scroll ${dur}s linear infinite`;
}

// ===== パチンコ物理 =====
const outHoles = [{x:10,y:230,w:60,h:10},{x:230,y:230,w:60,h:10}];
function setupCanvas() {
    pegs = [];
    for (let y = 60; y <= 210; y += 30) {
        const off = (Math.floor(y/30) % 2 === 0) ? 15 : 0;
        for (let x = 30; x < 280; x += 30) pegs.push({x:x+off, y, type:'pin'});
    }
    const addRail = (x1,y1,x2,y2) => {
        const dist = Math.sqrt((x2-x1)**2+(y2-y1)**2);
        for (let i=0; i<dist; i+=4) pegs.push({x:x1+(x2-x1)*(i/dist), y:y1+(y2-y1)*(i/dist), type:'rail'});
    };
    addRail(0,260,110,315); addRail(300,260,190,315);

    document.getElementById('shootBtn').onclick = () => {
        if (balls <= 0) return;
        const cnt = equippedTool==='t-twin' ? 2 : equippedTool==='t-triple' ? 3 : equippedTool==='t-gravity' ? 5 : 1;
        for (let i=0; i<cnt; i++) {
            if (balls > 0) { balls--; totalShots++; activeBalls.push({x:150+(Math.random()-0.5)*20, y:-10, vx:(Math.random()-0.5)*2, vy:2}); }
        }
        updateUI();
    };
    setInterval(() => { if (equippedTool==='t-auto' && balls>0) document.getElementById('shootBtn').click(); }, 400);
}

function draw() {
    const canvas = document.getElementById('pachinkoCanvas');
    const ctx = canvas.getContext('2d');
    const skin = ITEMS.skins.find(s => s.id === activeSkin) || ITEMS.skins[0];
    ctx.fillStyle = skin.bg; ctx.fillRect(0,0,300,340);
    outHoles.forEach(h => { ctx.fillStyle='#300'; ctx.fillRect(h.x,h.y,h.w,h.h); });
    pegs.forEach(p => {
        ctx.fillStyle = p.type==='rail' ? '#444' : skin.pin;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.type==='rail'?1.2:2,0,7); ctx.fill();
    });
    const cX = 135 + Math.sin(Date.now()/500)*60;
    ctx.strokeStyle = '#0ff'; ctx.strokeRect(cX,315,30,15);
    for (let i=0; i<activeBalls.length; i++) {
        let b = activeBalls[i];
        b.vy += 0.22; b.x += b.vx; b.y += b.vy;
        pegs.forEach(p => {
            const dx=b.x-p.x, dy=b.y-p.y, d=Math.sqrt(dx*dx+dy*dy);
            if (d<7) { const a=Math.atan2(dy,dx); b.vx=Math.cos(a)*1.8; b.vy=Math.sin(a)*1.8; }
        });
        outHoles.forEach(h => { if(b.x>h.x&&b.x<h.x+h.w&&b.y>h.y&&b.y<h.y+h.h){activeBalls.splice(i,1);i--;} });
        if (b && b.y>315 && b.x>cX && b.x<cX+30) {
            activeBalls.splice(i,1); i--;
            if (stock<4) { stock++; updateUI(); startSlot(); }
        } else if (b && b.y>350) { activeBalls.splice(i,1); i--; }
        if (b) { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,4,0,7); ctx.fill(); }
    }
    requestAnimationFrame(draw);
}

function startSlot() {
    if (isSpinning) return;
    isSpinning = true;
    let count = 0;
    const syms = ['🎰','💰','💎','🍒','7️⃣'];
    const timer = setInterval(() => {
        ['s1','s2','s3'].forEach(id => document.getElementById(id).innerText = syms[Math.floor(Math.random()*5)]);
        if (++count > 12) { clearInterval(timer); checkWin(); }
    }, 80);
}

function checkWin() {
    const prob = isKakuhen ? G.kakuhenProb : G.normalProb;
    if (Math.random() < prob) {
        if (Math.random() < G.goldProb) {
            applyLuckBonus(G.goldRate);
            inventory.gold++; isKakuhen = true; comboCount++;
        } else {
            applyLuckBonus(G.silverRate);
            inventory.silver++; isKakuhen = false; comboCount = 0;
        }
    } else if (document.getElementById('s1').innerText === document.getElementById('s2').innerText) {
        inventory.bronze++;
    } else {
        comboCount = 0;
    }
    isSpinning = false; stock--; updateUI();
    if (stock > 0) setTimeout(startSlot, 300);
}

function applyLuckBonus(base) {
    const LM = G.luckMulti;
    if (LM === 1) return base;
    if (LM > 1) {
        if (LM <= 10) {
            if (Math.random() < (LM-1)*0.1) { toast(`⭐ LUCK BONUS x${LM}!`, '#a0f'); return Math.floor(base*LM); }
        } else {
            let result = Math.floor(base*LM);
            if (Math.random() < (LM-10)*0.1) { toast(`🌟 DOUBLE LUCK!! x${LM}x${LM}!`, '#f0f'); result = Math.floor(result*LM); }
            else toast(`⭐ LUCK BONUS x${LM}!`, '#a0f');
            return result;
        }
    } else if (LM < 1) {
        if (Math.random() < 1-LM) { toast(`💀 BAD LUCK x${LM}`, '#f44'); return Math.floor(base*LM); }
    }
    return base;
}

// ===== ゲームアクション =====
function buyBalls() {
    if (money < 150) return;
    money -= 150; totalSpent += 150; balls += 50; updateUI();
}

function exchangeSingle(type) {
    const rate = type==='gold' ? G.goldRate : type==='silver' ? G.silverRate : 100;
    if (inventory[type] <= 0) return;
    money += inventory[type] * rate;
    inventory[type] = 0;
    updateUI();
}

function itemAction(id, price, type) {
    if (!ownedItems.includes(id)) {
        if (money < price) return;
        money -= price; ownedItems.push(id);
    } else {
        if (type === 't') equippedTool = equippedTool===id ? null : id;
        if (type === 's') activeSkin = id;
    }
    updateUI();
}

function claimMission(id, rm, rb) {
    const claimed = JSON.parse(localStorage.getItem('p_m_claimed') || '[]');
    if (claimed.includes(id)) return;
    claimed.push(id);
    localStorage.setItem('p_m_claimed', JSON.stringify(claimed));
    money += rm; balls += rb;
    toast(`🎁 $${rm.toLocaleString()} + ${rb}玉 GET!`, '#0f0');
    updateUI();
}

function takeLoan(id) {
    const l = ITEMS.loans.find(x => x.id === id);
    if (!l) return;
    if (!confirm(`${l.name}\n借入額: $${l.amount.toLocaleString()}\n利息: ログインのたびに10%加算\n\n借りますか？`)) return;
    money += l.amount; debt += l.amount;
    toast(`💸 $${l.amount.toLocaleString()} 借入完了！`, '#f90');
    updateUI();
}

function takeCustomLoan() {
    const amt = parseInt(document.getElementById('loan-input').value);
    if (isNaN(amt) || amt <= 0) return alert('金額を入力してくれ');
    if (!confirm(`$${amt.toLocaleString()} 借りますか？\n利息: ログインのたびに10%加算`)) return;
    money += amt; debt += amt;
    document.getElementById('loan-input').value = '';
    toast(`💸 $${amt.toLocaleString()} 借入完了！`, '#f90');
    updateUI();
}

function repayDebt(all = false) {
    if (debt <= 0) return;
    const amt = all ? debt : parseInt(document.getElementById('loan-input').value);
    if (!all && (isNaN(amt) || amt <= 0)) return alert('返済額を入力してくれ');
    if (money < amt) return alert('所持金が足りない！');
    const actual = Math.min(amt, debt);
    money -= actual; debt -= actual;
    toast(`✅ $${actual.toLocaleString()} 返済！ 残債: $${debt.toLocaleString()}`, '#0f0', 2500);
    updateUI();
}

function softReset() {
    if (!confirm('全リセットするぜ？')) return;
    initData(true); updateUI();
}

// ===== 管理者機能 =====
function authAdmin() {
    if (!document.getElementById('admin-pw').value.includes('ryo1031')) return alert('コードが違う');
    document.getElementById('admin-panel-ui').style.display = 'block';
    document.getElementById('admin-auth-area').style.display = 'none';
    // 現在値をフォームに反映
    document.getElementById('adm-kakuhen-prob').value = (G.kakuhenProb * 100).toFixed(0);
    document.getElementById('adm-normal-prob').value  = (G.normalProb  * 100).toFixed(0);
    document.getElementById('adm-gold-prob').value    = (G.goldProb    * 100).toFixed(0);
    document.getElementById('adm-silver-rate').value  = G.silverRate;
    document.getElementById('adm-gold-rate').value    = G.goldRate;
    document.getElementById('adm-luck-multi').value   = G.luckMulti;
}

function applyAdminSelf() {
    const m = parseInt(document.getElementById('adm-money').value);
    const b = parseInt(document.getElementById('adm-balls').value);
    if (!isNaN(m)) money = m;
    if (!isNaN(b)) balls = b;
    updateUI(); alert('書き換えた！');
}

function distributeGift() {
    const m = parseInt(document.getElementById('adm-dist-money').value) || 0;
    const b = parseInt(document.getElementById('adm-dist-balls').value) || 0;
    if (!m && !b) return alert('金額か玉数を入れてくれ');
    db.ref('users').once('value', snap => {
        snap.forEach(u => db.ref('gifts/' + u.key).push({money: m, balls: b}));
        alert(`配布完了！ $${m.toLocaleString()} + ${b}玉`);
    });
}

function postNews() {
    const msg = document.getElementById('adm-news-input').value.trim();
    if (!msg) return alert('内容を入れてくれ');
    db.ref('system/news').once('value', snap => {
        const existing = (snap.val() && snap.val().messages) ? snap.val().messages : [];
        const updated = [{text: msg, timestamp: Date.now()}, ...existing].slice(0, 5);
        db.ref('system/news').set({messages: updated});
        document.getElementById('adm-news-input').value = '';
        alert('投稿完了！');
    });
}

function clearNews() {
    db.ref('system/news').set({messages: []});
    alert('ニュースをクリアした');
}

function applyPayouts() {
    const settings = {
        kakuhen_prob: parseFloat(document.getElementById('adm-kakuhen-prob').value) / 100,
        normal_prob:  parseFloat(document.getElementById('adm-normal-prob').value)  / 100,
        gold_prob:    parseFloat(document.getElementById('adm-gold-prob').value)    / 100,
        silver_rate:  parseInt(document.getElementById('adm-silver-rate').value),
        gold_rate:    parseInt(document.getElementById('adm-gold-rate').value),
        luck_multi:   G.luckMulti
    };
    db.ref('system/settings').set(settings);
    alert('配当を全員に反映した！');
}

function applyLuckMulti() {
    const lm = parseFloat(document.getElementById('adm-luck-multi').value);
    if (isNaN(lm) || lm < 0) return alert('正しい値を入れてくれ');
    db.ref('system/settings').update({luck_multi: lm});
    alert(`ラックマルチ x${lm} を全員に反映した！`);
}

// ===== モーダル =====
function openModal(id) {
    // 管理者モーダルを開く時は毎回認証エリアをリセット
    if (id === 'admin-modal') {
        document.getElementById('admin-auth-area').style.display = 'block';
        document.getElementById('admin-panel-ui').style.display = 'none';
        document.getElementById('admin-pw').value = '';
    }
    document.getElementById(id).style.display = 'flex';
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// ===== トースト =====
function toast(msg, color = '#0ff', dur = 2000) {
    const t = document.createElement('div');
    t.innerText = msg;
    t.style.cssText = `position:fixed;top:15%;left:50%;transform:translateX(-50%);background:#111;border:2px solid ${color};color:${color};padding:10px 20px;border-radius:10px;font-weight:bold;z-index:9999;font-size:13px;pointer-events:none;white-space:nowrap;`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), dur);
}
